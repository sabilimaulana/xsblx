# One file for both uses, split by profile:
#   docker compose up -d                        # postgres only — `bun dev` on the host
#   docker compose --profile app up -d --build  # the whole stack in containers
# Compose reads the root `.env` for the interpolations below; see `.env.example`.

name: xsblx

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-xsblx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18 wants the whole directory, not `data/` — it stores each
      # major version in its own subdirectory so `pg_upgrade` can work.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SeaweedFS as one process — master, volume, filer and S3 gateway (ADR 0018).
  # Not in a profile: `bun dev` on the host needs the object store the same way
  # it needs postgres.
  #
  # The S3 identity file is written at startup from `.env`, so credentials are
  # configured in one place and never committed. `anonymous` may read
  # `xsblx/public` and nothing else — that prefix rule is what lets an avatar URL
  # work in an <img> tag with no signature, and what keeps `private/*` closed.
  # The trailing `*` is load-bearing: an action with no wildcard is compared for
  # equality against `<Action>:<bucket>` only, so `Read:xsblx/public` grants
  # nothing at all rather than granting the prefix.
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/s3.json <<JSON
        {
          "identities": [
            {
              "name": "anonymous",
              "actions": ["Read:${S3_BUCKET:-xsblx}/public/*"]
            },
            {
              "name": "app",
              "credentials": [
                {
                  "accessKey": "${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}",
                  "secretKey": "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
                }
              ],
              "actions": ["Read:${S3_BUCKET:-xsblx}", "Write:${S3_BUCKET:-xsblx}", "List:${S3_BUCKET:-xsblx}", "Tagging:${S3_BUCKET:-xsblx}"]
            }
          ]
        }
        JSON
        exec weed server -dir=/data -ip=seaweedfs -filer -s3 -s3.config=/tmp/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # `-ip=seaweedfs` binds every listener to that address, so `localhost`
      # is refused — the probe has to use the same name the network knows.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://seaweedfs:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A PutObject to a bucket that does not exist is a 404, and the S3 API cannot
  # create one under a non-admin identity. `weed shell` can, and this is the only
  # place that needs to.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.42
    entrypoint:
      - sh
      - -c
      - echo "s3.bucket.create -name ${S3_BUCKET:-xsblx}" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: "no"

  # Telemetry backend for local use only — `docker compose --profile otel up -d`,
  # then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 (or
  # http://otel:4318 from another container) and read Grafana on :3002.
  #
  # Prometheus, Tempo, Loki and Grafana in one container, so a single endpoint
  # takes all three signals. Jaeger cannot: it 404s /v1/metrics. Everything is
  # in memory and lost on restart — a dev convenience, never a deploy target.
  otel:
    profiles: [otel]
    image: grafana/otel-lgtm:0.30.1
    ports:
      # Grafana serves on 3000 inside the container, which is the server's port.
      - "${GRAFANA_PORT:-3002}:3000"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  # Runs to completion before the server starts, so a deploy never serves
  # traffic against an unmigrated schema.
  migrate:
    profiles: [app]
    build: { context: ., target: server }
    command: ["bun", "apps/server/src/migrate.ts"]
    environment:
      DATABASE_URL: &database-url postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-xsblx}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  server:
    profiles: [app]
    build: { context: ., target: server }
    environment:
      PORT: 3000
      WORKERS: ${WORKERS:-4}
      DATABASE_URL: *database-url
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      # Unset resolves to an empty string, which reads as "no endpoint" — the
      # server then builds spans and exports nothing. With the otel profile up,
      # set this to http://jaeger:4318.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-xsblx-server}
      LOG_LEVEL: ${LOG_LEVEL:-Info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      S3_ENDPOINT: http://seaweedfs:8333
      # Avatar URLs are handed to a browser, which cannot resolve `seaweedfs`.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-xsblx}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      seaweedfs-init: { condition: service_completed_successfully }

  web:
    profiles: [app]
    build:
      context: .
      target: web
      # The API origin is compiled into the client bundle, so it is a build
      # argument, not a runtime variable.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    environment:
      PORT: 3001
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      - server

volumes:
  postgres-data:
  seaweedfs-data:
