pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,css}"
      exclude: "repos/**"
      run: export PATH="$HOME/.bun/bin:$PATH" && bun x oxfmt --disable-nested-config {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      exclude: "repos/**"
      run: export PATH="$HOME/.bun/bin:$PATH" && bun x oxlint --disable-nested-config {staged_files}
