name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Tests hit a real Postgres (ADR 0004). A throwaway service container is the
    # whole point of reading DATABASE_URL from .env.test: nothing is shared, so
    # nothing carries over between runs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xsblx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # The suite migrates this database itself, so no db:migrate step here.
      - run: echo 'DATABASE_URL=postgres://postgres:postgres@localhost:5432/xsblx_test' > apps/server/.env.test

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
