name: CI

on:
  push:
    branches: [main, cloudflare]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # No service containers: D1 and R2 are Cloudflare's (ADR 0020, ADR 0021), so
    # nothing here touches a database. The tests that do are `*.e2e.test.ts` —
    # they deploy a stage and need account credentials, which is `bun run
    # test:e2e`, not this job.
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
